<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Checker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
</head>
<body class="container text-center mt-5">
    <h1>ICT CLUB CHECKER</h1>
    <p>Candidate Verification System</p>

    <div class="card p-4 mx-auto mt-4" style="max-width: 350px;">
        <input type="text" id="first_name" class="form-control mb-3" placeholder="First Name">
        <input type="text" id="last_name" class="form-control mb-3" placeholder="Last Name">
        <button py-click="result_checker" class="btn btn-danger">ENTER</button>
    </div>

    <div id="output" class="alert mt-3 mx-auto" style="max-width: 350px;"></div>

    <footer class="mt-5">
        © 2026 ICT Club • Seatwork 2 • 2nd Quarter
    </footer>

    <script type="py" src="main.py"></script>
</body>
</html>
